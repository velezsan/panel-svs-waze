name: Escaneo de segmentos sin nombre

on:
  schedule:
    - cron: '17 */4 * * *'   # 6 veces al día, cada 4 horas (con 30 min de holgura entre corridas)
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de escaneo'
        type: choice
        default: completo
        options: [test, completo]
      minutos:
        description: 'Duración máxima en minutos'
        default: '210'
      zona:
        description: 'Re-escaneo prioritario: estado, "lat,lon" o bbox (vacío = barrido normal)'
        default: ''

permissions:
  contents: write

concurrency:
  group: escaneo
  cancel-in-progress: false

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: evita conflictos falsos al hacer rebase

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Correr escáner
        run: |
          python scanner/scan.py \
            --modo "${{ github.event.inputs.modo || 'completo' }}" \
            --minutos "${{ github.event.inputs.minutos || '210' }}" \
            --zona="${{ github.event.inputs.zona || '' }}"

      - name: Guardar resultados
        run: |
          git config user.name "escaner-bot"
          git config user.email "actions@users.noreply.github.com"
          git rebase --abort 2>/dev/null || true
          # Sin rebase: la rama se coloca sobre origin y se vuelven a marcar solo
          # las rutas de este panel. El rebase fallaba ("unstaged changes") porque
          # el árbol conserva copias viejas de los archivos del otro escáner.
          ok=0
          for i in 1 2 3 4 5; do
            git fetch origin ${GITHUB_REF_NAME} || { sleep 10; continue; }
            git reset --mixed origin/${GITHUB_REF_NAME}
            for p in docs/data state/scan_state.json state/last_run.json state/debug_ultimo_error.txt; do
              git add -A "$p" 2>/dev/null || true
            done
            if git diff --cached --quiet; then
              echo "Sin cambios que guardar"; ok=1; break
            fi
            git commit -m "Escaneo automático $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:${GITHUB_REF_NAME}; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = "1" ]
